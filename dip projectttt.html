<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSB Steganography Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .cyber-panel { background: rgba(30, 41, 59, 0.7); border: 1px solid #334155; border-radius: 0.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-4xl w-full">
        <h1 class="text-3xl font-bold text-teal-400 mb-2 text-center">Steganography Tool</h1>
        <p class="text-slate-400 text-center mb-8">Hide and extract secret messages inside PNG/BMP images using Least Significant Bit (LSB) encoding.</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Encode Panel -->
            <div class="cyber-panel p-6">
                <h2 class="text-xl font-semibold text-teal-300 mb-4 border-b border-slate-600 pb-2">Encode Message</h2>
                <input type="file" id="encodeImage" accept="image/png, image/bmp" class="mb-4 block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-teal-900 file:text-teal-300 hover:file:bg-teal-800">
                <textarea id="encodeText" rows="4" placeholder="Enter secret message here..." class="w-full bg-slate-800 border border-slate-600 rounded p-3 text-slate-200 focus:outline-none focus:border-teal-500 mb-4"></textarea>
                <button onclick="encode()" class="w-full bg-teal-600 hover:bg-teal-500 text-white font-bold py-2 px-4 rounded transition-colors">Embed & Download</button>
                <canvas id="encodeCanvas" class="hidden"></canvas>
            </div>

            <!-- Decode Panel -->
            <div class="cyber-panel p-6">
                <h2 class="text-xl font-semibold text-indigo-300 mb-4 border-b border-slate-600 pb-2">Decode Message</h2>
                <input type="file" id="decodeImage" accept="image/png, image/bmp" class="mb-4 block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-900 file:text-indigo-300 hover:file:bg-indigo-800">
                <button onclick="decode()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-4 rounded transition-colors mb-4">Extract Message</button>
                <textarea id="decodeText" rows="4" placeholder="Extracted message will appear here..." readonly class="w-full bg-slate-800 border border-slate-600 rounded p-3 text-emerald-400 font-mono focus:outline-none"></textarea>
                <canvas id="decodeCanvas" class="hidden"></canvas>
            </div>
        </div>
    </div>

    <script>
        const DELIMITER = ":::END:::";

        function encode() {
            const fileInput = document.getElementById('encodeImage');
            const text = document.getElementById('encodeText').value;
            if (!fileInput.files || fileInput.files.length === 0) return alert('Please select an image.');
            if (!text) return alert('Please enter a message to hide.');

            const file = fileInput.files[0];
            if (file.type === 'image/jpeg') return alert('JPEG not supported. Compression destroys LSB data. Use PNG or BMP.');

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('encodeCanvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imgData.data;

                    const encoder = new TextEncoder();
                    const textData = encoder.encode(text + DELIMITER);
                    
                    // Check capacity
                    const capacity = Math.floor((data.length / 4) * 3 / 8); 
                    if (textData.length > capacity) {
                        return alert('Message is too long for this image.');
                    }

                    let dataIndex = 0;
                    let bitIndex = 0;

                    for (let i = 0; i < data.length; i++) {
                        if ((i + 1) % 4 === 0) continue; // Skip alpha channel
                        if (dataIndex >= textData.length) break;

                        const bit = (textData[dataIndex] >> (7 - bitIndex)) & 1;
                        data[i] = (data[i] & ~1) | bit;

                        bitIndex++;
                        if (bitIndex === 8) {
                            bitIndex = 0;
                            dataIndex++;
                        }
                    }

                    ctx.putImageData(imgData, 0, 0);
                    
                    const link = document.createElement('a');
                    link.download = 'encoded_image.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function decode() {
            const fileInput = document.getElementById('decodeImage');
            if (!fileInput.files || fileInput.files.length === 0) return alert('Please select an encoded image.');

            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('decodeCanvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imgData.data;

                    let extractedBits = [];
                    let extractedBytes = [];
                    let decodedText = "";
                    const decoder = new TextDecoder();

                    for (let i = 0; i < data.length; i++) {
                        if ((i + 1) % 4 === 0) continue; // Skip alpha channel

                        extractedBits.push(data[i] & 1);

                        if (extractedBits.length === 8) {
                            let byteValue = 0;
                            for (let b = 0; b < 8; b++) {
                                byteValue = (byteValue << 1) | extractedBits[b];
                            }
                            extractedBytes.push(byteValue);
                            extractedBits = [];

                            // Try decoding periodically to check for delimiter
                            if (extractedBytes.length % 3 === 0 || extractedBytes.length > 9) {
                                decodedText = decoder.decode(new Uint8Array(extractedBytes));
                                if (decodedText.includes(DELIMITER)) {
                                    document.getElementById('decodeText').value = decodedText.replace(DELIMITER, '');
                                    return;
                                }
                            }
                        }
                    }
                    document.getElementById('decodeText').value = decodedText || "No message found or corrupted.";
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
